globals:
  - id: notif_title
    type: std::string
  - id: notif_body
    type: std::string

text_sensor:
  - platform: signalk
    id: notifications
    path: notifications.*
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("notify", "Notification: %s", x.c_str());

            json::parse_json(x, [&](JsonObject root) -> bool {

              if (!root["message"].is<const char*>() ||
                  !root["state"].is<const char*>()) {
                ESP_LOGW("notify", "Invalid notification JSON");
                return false;
              }

              std::string message = root["message"].as<std::string>();
              std::string state   = root["state"].as<std::string>();
              std::string category =
                root["category"].is<const char*>() ?
                root["category"].as<std::string>() : "Notification";

              /* Severity → icon & color */
              const char *icon = "\U000F02DC"; // bell
              lv_color_t bg = lv_color_hex(0x404040);

              if (state == "alert" || state == "emergency") {
                icon = "\U000F0026";
                bg = lv_color_hex(0x802020);
              } else if (state == "warn") {
                icon = "\U000F0026";
                bg = lv_color_hex(0x805000);
              }

              /* Build message text */
              std::string body =
                std::string(icon) + " " + message +
                "\n\nState: " + state;

              /* Create msgbox (LVGL 9 API) */
              lv_obj_t *mb = lv_msgbox_create(lv_screen_active());
              lv_obj_t *title = lv_msgbox_add_title(mb, category.c_str());
              lv_msgbox_add_text(mb, body.c_str());
              lv_msgbox_add_close_button(mb);
              lv_obj_set_size(mb, 600, 600);   // width, height in pixels
              lv_obj_center(mb);
              lv_obj_set_style_bg_color(mb, bg, 0);

              /* Bigger message text */
              lv_obj_t *content = lv_msgbox_get_content(mb);
              lv_obj_set_style_text_font(content, id(roboto_scriptsize), 0);
              lv_obj_set_style_text_color(content, lv_color_hex(0xFFFFFF), 0);

              lv_obj_set_style_text_font(title, id(roboto_small), 0);
              lv_obj_set_style_text_color(title, lv_color_hex(0xFFFFFF), 0);

              /* Footer buttons; either one closes the box */
              for (const char *text : { "Mute", "Ack" }) {
                lv_obj_t *btn = lv_msgbox_add_footer_button(mb, text);
                // Make button text bigger, increase padding and minimum size
                lv_obj_set_style_text_font(btn, id(roboto_scriptsize), 0);
                lv_obj_set_style_pad_ver(btn, 12, 0);
                lv_obj_set_style_pad_hor(btn, 20, 0);
                lv_obj_set_style_min_width(btn, 120, 0);
                lv_obj_set_style_min_height(btn, 50, 0);
                lv_obj_add_event_cb(
                  btn,
                  [](lv_event_t *e) {
                    lv_msgbox_close_async(static_cast<lv_obj_t *>(lv_event_get_user_data(e)));
                  },
                  LV_EVENT_CLICKED,
                  mb
                );
              }

              return true;
            });


lvgl:
  msgboxes:
    - id: message_box
      close_button: true
      title: Message box
      body:
        text: "This is a sample message box."
        bg_color: 0x808080

---
# Swipe navigation
  on_swipe_right:
    - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
    - logger.log: "Swipe right"
    - lvgl.page.next:
        animation: OUT_RIGHT
        time: 100ms
  on_swipe_left:
    - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
    - logger.log: "Swipe left"
    - lvgl.page.previous:
        animation: OUT_LEFT
        time: 100ms
  # on_swipe_down:
  #     - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
  #     - logger.log: "Swipe down"
  #     - lvgl.page.show: 
  #         id: settings_page
  #         animation: OUT_BOTTOM
  #         time: 100ms
  on_swipe_down:
    - lambda: |-
        if (!id(swipe_started_at_top)) return;
        id(last_screen) = lv_scr_act();
        lv_indev_t * indev = lv_indev_get_act();
        if (indev) lv_indev_wait_release(indev);

        ESP_LOGI("lvgl", "Swipe down started at top");

        lv_scr_load_anim(
          id(settings_page)->obj,
          LV_SCR_LOAD_ANIM_OUT_BOTTOM,
          100,
          0,
          false
        );
sensor:
  - platform: signalk
    id: grid_environment_wind_speedApparent
    path: environment.wind.speedApparent
    period: 200
    accuracy_decimals: 2
    unit: ${speed_units}
    on_value:
      - lvgl.label.update:
          id: label_apparent_wind_speed
          text:
            format: "%4.1f"
            args: [ 'x' ]

  - platform: signalk
    id: grid_environment_wind_speedTrue
    path: environment.wind.speedTrue
    period: 200
    accuracy_decimals: 2
    unit: ${speed_units}
    on_value:
      - lvgl.label.update:
          id: label_true_wind_speed
          text:
            format: "%4.1f"
            args: [ 'x' ]
  
  - platform: signalk
    id: grid_navigation_speedOverGround
    path: navigation.speedOverGround
    period: 200
    accuracy_decimals: 2
    unit: ${speed_units}
    on_value:
      - lvgl.label.update:
          id: label_speed_over_ground
          text:
            format: "%4.1f"
            args: [ 'x' ]

  - platform: signalk
    id: grid_navigation_speedThroughWater
    path: navigation.speedThroughWater
    period: 200
    accuracy_decimals: 2
    unit: ${speed_units}
    on_value:
      - lvgl.label.update:
          id: label_speed_through_water
          text:
            format: "%4.1f"
            args: [ 'x' ]

    

lvgl:
  pages:
    - id: grid_page
      <<: !include
        file: ../base/swipe_navigation.yaml
      widgets:
        - image:
            src: background_image
            align: CENTER

        - obj:
            width: 100%
            height: 100%
            scrollable: "true"
            scrollbar_mode: "OFF"
            pad_all: 8
            bg_opa: TRANSP

            layout:
                type: FLEX
                flex_flow: ROW_WRAP
                flex_align_main: SPACE_EVENLY
                flex_align_cross: START

            widgets: 
              - !include 
                  vars: 
                    text: "0.00"
                    id: label_speed_over_ground
                    description: "SOG"
                    unit: ${speed_units}
                  file: ../components/grid_element.yaml

              - !include 
                  vars: 
                    text: "0.00"
                    id: label_apparent_wind_speed
                    description: "AWS"
                    unit: ${speed_units}
                  file: ../components/grid_element.yaml

              - !include 
                  vars: 
                    text: "0.00"
                    id: label_true_wind_speed
                    description: "TWS"
                    unit: ${speed_units}
                  file: ../components/grid_element.yaml

              - !include 
                  vars: 
                    text: "0.00"
                    id: label_speed_through_water
                    description: "STW"
                    unit: ${speed_units}
                  file: ../components/grid_element.yaml


        - !include { file: ../components/top_touch_detector.yaml }
substitutions:
  engine_size: ${screen_width}
  engine_meter_width: ${(engine_size / 15)| int}
  engine_rpm_indicator_size: ${(engine_size / 15)| int}

sensor:  
  - platform: signalk
    id: engine_rpm_sensor
    path: propulsion.p0.revolutions
    name: "Engine RPM"
    unit_of_measurement: "rpm"
    period: 200
    accuracy_decimals: 0
    unit: rotations_per_minute
    on_value:
      - lvgl.indicator.update:
          id: engine_rpm
          value: !lambda return x;

  - platform: signalk
    id: engine_temperature_sensor
    path: propulsion.p0.temperature
    name: "Engine Temperature"
    unit_of_measurement: "°C"
    period: 200
    accuracy_decimals: 0
    unit: celsius
    on_value:
      - lvgl.indicator.update:
          id: engine_temperature
          value: !lambda return x;

    

image:
  - file: modules/assets/engine_rpm.svg
    id: engine_rpm_indicator
    resize: 90x40
    type: ${color_encoding}
    transparency: alpha_channel
    byte_order: ${byte_order}

  - file: modules/assets/engineBatteryVoltage.svg
    id: fuel_indicator
    resize: 22x20
    type: ${color_encoding}
    transparency: alpha_channel
    byte_order: ${byte_order}

  - file: modules/assets/engine_temperature.svg
    id: engine_temperature_icon
    resize: 64x64
    type: ${color_encoding}
    transparency: alpha_channel
    byte_order: ${byte_order}

  - file: modules/assets/oil.svg
    id: engine_oil_pressure_icon
    resize: 64x32
    type: ${color_encoding}
    transparency: alpha_channel
    byte_order: ${byte_order}

  - file: modules/assets/fuel.svg
    id: engine_fuel_icon
    resize: 36x36
    type: ${color_encoding}
    transparency: alpha_channel
    byte_order: ${byte_order}

lvgl:
  pages:
    - id: engine_page
      <<: !include
        file: ../base/swipe_navigation.yaml
      widgets:
        - image:
            src: background_image
            align: CENTER
        - meter:
            height: $engine_size
            width: $engine_size
            anim_time: 500ms
            text_font: roboto_small
            scales:
 
              # RPM Scale
              - range_from: 0
                range_to: 5000
                angle_range: 240
                rotation: 150
                ticks:
                  count: 51
                  width: 8
                  length: ${engine_meter_width- 10}
                  color: white
                indicators:
                  - image:
                      id: engine_rpm
                      src: engine_rpm_indicator
                      pivot_x: -${(engine_size/2 - 120)| int}
                      pivot_y: 20
                      value: 50
                  - tick_style:
                      start_value: 3500
                      end_value: 5000
                      color_start: 0xFF0000
                      color_end: 0xFF0000
                      width: 2
                      local: true
                  - arc:
                      color: 0xFFFF00
                      start_value: 0
                      end_value: 3500
                      width: 5
                      r_mod: 10
                  - arc:
                      color: 0xFF0000
                      start_value: 3500
                      end_value: 5000
                      width: 5
                      r_mod: 10
                  - arc:
                      color: 0x00FF00
                      start_value: 1500
                      end_value: 3500
                      width: 5
                      r_mod: 10

              # indicator for every 100 rpm
              - range_from: 0
                range_to: 50
                angle_range: 240
                rotation: 150
                ticks:
                  count: 11
                  width: 8
                  length: ${engine_meter_width}
                  color: white
                  major:
                    stride: 2
                    width: 12
                    length: ${engine_meter_width + 10}
                    color: 0xFFFFFF
                    label_gap: 30
                indicators:
                  - tick_style:
                      start_value: 0
                      end_value: 35
                      color_start: 0xFFFFFF
                      color_end: 0xFFFFFF
                      width: 2
                      local: true
                  - tick_style:
                      start_value: 35
                      end_value: 50
                      color_start: 0xFF0000
                      color_end: 0xFF0000
                      width: 2
                      local: true
             # Temperature scale
              - range_from: 120 # Reverse the scale so the indicator goes counterclockwise
                range_to: 0
                angle_range: 80
                rotation: 50
                ticks:
                  count: 5
                  width: 8
                  length: 20
                  color: white
                indicators:
                  - image:
                      id: engine_temperature
                      src: engine_rpm_indicator
                      pivot_x: -${(engine_size/2 - 100)| int}
                      pivot_y: 20
                      value: 50
        
        - meter:
            height: 400
            width: 400
            anim_time: 500ms
            text_font: roboto_small
            align: CENTER

            scales:
              
              - range_from: 0 # Reverse the scale so the indicator goes counterclockwise
                range_to: 100
                angle_range: 90
                rotation: 120
                ticks:
                  count: 5
                  width: 6
                  length: 20
                  color: white
                indicators:

                  - image:
                      id: engine_oil_pressure_indicator
                      src: fuel_indicator
                      pivot_x: -160
                      pivot_y: 10
                      value: 50
                  - arc:
                      color: 0x00FF00
                      start_value: 50
                      end_value: 70
                      width: 10
                      r_mod: 0
                  - arc:
                      color: 0xFFFFFF
                      start_value: 0
                      end_value: 100
                      width: 5
                      r_mod: 5
              
              - range_from: 100 # Reverse the scale so the indicator goes counterclockwise
                range_to: 0
                angle_range: 90
                rotation: 330
                ticks:
                  count: 5
                  width: 6
                  length: 20
                  color: white
                indicators:

                  - image:
                      id: engine_fuel_indicator
                      src: fuel_indicator
                      pivot_x: -160
                      pivot_y: 10
                      value: 20
                  - arc:
                      color: 0xFF0000
                      start_value: 20
                      end_value: 0
                      width: 10
                      r_mod: 0
                  - arc:
                      color: 0xFFFFFF
                      start_value: 100
                      end_value: 0
                      width: 5
                      r_mod: 5

        - image:
            src: engine_temperature_icon
            align: BOTTOM_MID
            y: -80
        - image:
            src: engine_oil_pressure_icon
            align: CENTER
            x: -80
        - image:
            src: engine_fuel_icon
            align: CENTER
            x: 80
        
        - label:
            text: "RPM\nx100"
            align: TOP_MID
            text_align: CENTER
            # text_color: 0xFFFFFF
            text_font: roboto_scriptsize
            y: 80

        - !include { file: ../components/top_touch_detector.yaml }
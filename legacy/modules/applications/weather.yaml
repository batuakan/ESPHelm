time:
  - platform: homeassistant
    id: esptime      
    # timezone: Europe/Amsterdam 
    on_time:
      - hours: 0
        minutes: 0
        seconds: 0
        then:
          - lvgl.label.update:
              id: date_label
              text: !lambda |-
                return id(esptime).now().strftime("%a %b %d").c_str();
    #  "Date :%Y-%b-%d", id(homeassistant_time).now());

interval:
  - interval: 1s
    then:
      - lvgl.label.update:
          id: time_label
          text: !lambda |-
            return id(esptime).now().strftime("%H:%M:%S").c_str();
      - lvgl.label.update:
          id: date_label
          text: !lambda |-
            return id(esptime).now().strftime("%a %b %d").c_str();



text_sensor:
  - platform: homeassistant
    id: weather_condition
    entity_id: weather.home
    on_value:
      - lvgl.label.update:
          id: weather_condition_today
          text: !lambda |-
            return x.c_str();
      - lvgl.image.update:
          id: weather_icon
          src: !lambda |-
            ESP_LOGD("weather", "cond='%s'", x.c_str());
            return map_weather_icon(x);
            

sensor:
  - platform: homeassistant
    id: outside_temperature
    entity_id: weather.home
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: outdoor_temp
          text:
            format: "%.1f°C"
            args: [ 'x' ]

  - platform: homeassistant
    id: sensor_wind_speed
    entity_id: weather.home
    attribute: wind_speed
    on_value:
      - lvgl.label.update:
          id: wind_speed
          text:
            format: "%.1fKn"
            args: [ 'x' ]

lvgl:
  pages:
    - id: weather_page
      <<: !include
        file: ../base/swipe_navigation.yaml
      widgets:
        - image:
            src: background_image
            align: CENTER
        # =========================
        # FULLSCREEN CONTAINER
        # =========================
        - obj:
            width: 100%
            height: 100%
            bg_opa: TRANSP
            pad_all: 12

            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: SPACE_BETWEEN

            widgets:

              # =========================
              # TIME & DATE
              # =========================
              - obj:
                  width: 100%
                  height: 30%
                  bg_opa: 20%
                  radius: 20
                  pad_all: 16
                  align: CENTER

                  scrollable: false                  
                  scrollbar_mode: "OFF"

                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER     # vertical centering
                    flex_align_cross: CENTER    # horizontal centering

                  widgets:
                    - label:
                        id: time_label
                        width: 100%              # IMPORTANT
                        text:
                          time_format: "%H:%M:%S"
                          time: esptime
                        text_font: roboto_Huge
                        text_align: CENTER
                    - label:
                        id: date_label
                        width: 100%              # IMPORTANT
                        text:
                          time_format: "%a, %b %d"
                          time: esptime
                        text_font: roboto_normalsize
                        text_align: CENTER

              # =========================
              # CURRENT WEATHER
              # =========================
              - obj:
                  width: 100%
                  height: 30%
                  bg_opa: 20%
                  radius: 20
                  pad_all: 16

                  scrollable: false                  
                  scrollbar_mode: "OFF"

                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_BETWEEN
                    flex_align_cross: CENTER

                  widgets:

                    # LEFT: ICON + CONDITION
                    - obj:
                        bg_opa: TRANSP
                        scrollable: false                  
                        scrollbar_mode: "OFF"

                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_cross: CENTER

                        widgets:
                          - image:
                              id: weather_icon
                              src: weather_default
                          - label:
                              id: weather_condition_today
                              text: "---"
                              text_font: roboto_scriptsize
                              text_align: CENTER

                    # RIGHT: TEMP + WIND
                    - obj:
                        bg_opa: TRANSP
                        width: 200px

                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_cross: END

                        widgets:
                          - label:
                              id: outdoor_temp
                              text: "22°C"
                              text_font: roboto_large
                          - label:
                              id: wind_speed
                              text: "Wind 12 kn"
                              text_font: roboto_scriptsize

              # =========================
              # FORECAST (NEXT DAYS)
              # =========================
              - obj:
                  width: 100%
                  height: 60%
                  bg_opa: 20%
                  radius: 20
                  pad_all: 0
                  scrollable: true                  
                  scrollbar_mode: "OFF"

                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: CENTER
                    flex_align_cross: CENTER

                  widgets:

                    # DAY 1
                    - !include { vars:{ day: Tue, id: 1 }, file: ../components/weather_forecast.yaml }
                    - !include { vars:{ day: Tue, id: 2 }, file: ../components/weather_forecast.yaml }
                    - !include { vars:{ day: Tue, id: 3 }, file: ../components/weather_forecast.yaml }
                    - !include { vars:{ day: Tue, id: 4 }, file: ../components/weather_forecast.yaml }
                    - !include { vars:{ day: Tue, id: 5 }, file: ../components/weather_forecast.yaml }
        - !include { file: ../components/top_touch_detector.yaml }




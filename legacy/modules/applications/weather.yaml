# Important for this screen to work you have to make homeassistant publish the forecast as a sensor
# Add the following to your homeassistant configuration.yaml file

#  https://tutoduino.fr/en/home-assistant-weather-reterminal-e1001/

esphome:
  includes:
    - modules/components/weather_icons.h

substitutions:
  weather_iconsize: ${(screen_width / 8) | int}x${(screen_width / 8) | int}

packages:
  forecast_day_1: !include { vars: { id: 1 }, file: ../components/weather_forecast_sensors.yaml }
  forecast_day_2: !include { vars: { id: 2 }, file: ../components/weather_forecast_sensors.yaml }
  forecast_day_3: !include { vars: { id: 3 }, file: ../components/weather_forecast_sensors.yaml }
  forecast_day_4: !include { vars: { id: 4 }, file: ../components/weather_forecast_sensors.yaml }
  forecast_day_5: !include { vars: { id: 5 }, file: ../components/weather_forecast_sensors.yaml }




substitutions:
  # Screen Size
  screen_height: '480px'
  screen_width: '480px'

  #theme
  text_font: roboto_scriptsize
  text_color: white


esphome:
  name: "waveshare-esp32-s3-t-lcd-21c"
  friendly_name: "Waveshare-2.1-round"
  comment: "Waveshare ESP32-S3-Touch-LCD-2.1C 480px Round Screen" 

# Enable logging
logger:
# api:
# web_server:
#   port: 80
#   version: 3 
# ota:
#   platform: esphome
# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password 

packages:
  wifi: !include modules/base/wifi.yaml
  # Harware description file
  hardware: !include modules/hardware/waveshare-esp32-s3-touch-lcd-2.1c.yaml

# LVGL Configuration
# lvgl:
#   - id: lvgl_display
#     displays:
#       - my_display
#     widgets:
#       - label:
#           id: coord_text
#           align: CENTER
#           text_align: CENTER
#           text: 'Touch the screen'

external_components:
  - source: github://batuakan/ESPHomeSignalK@main
    components: [ signalk ]

signalk:
  host: 192.168.0.3

text_sensor:
  - platform: signalk
    id: name
    path: name

sensor:
  - platform: signalk
    id: electrical_batteries_shunt_capacity_stateOfCharge
    path: electrical.batteries.shunt.capacity.stateOfCharge
    period: 200
    accuracy_decimals: 2
    # on_value:
    #   - lvgl.indicator.update:
    #       id: battery_state_of_charge_needle
    #       value: !lambda return x * 100;

  - platform: signalk
    id: environment_wind_angleApparent
    path: environment.wind.angleApparent
    period: 200
    accuracy_decimals: 2
    on_value:
      - lvgl.indicator.update:
          id: wind_needle
          value: !lambda double degrees = x * 180.0 / 3.1415; if (degrees < 0) degrees +=360; return degrees;


font:
  - file: 'modules/assets/fonts/PoetsenOne-Regular.ttf'
    id: font_32
    size: 64

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  theme: !include { file: modules/base/theme.yaml }
  pages:
    # - id: meter_page
    #   bg_color: 0x000000
    #   <<: !include
    #     file: modules/sections/swipe_navigation.yaml
    #   widgets:
    #     <<: !include
    #       file: modules/screens/energry_screen.yaml
    - id: wind_page
      bg_color: 0x000000
      <<: !include
        file: modules/sections/swipe_navigation.yaml
      widgets:
        <<: !include
          file: modules/screens/wind_screen.yaml


# Runtime firmware on the desktop (SDL host build), 720x720 with the P4-86 font sizes.
# Same as esphelm_sdl.yaml (test hooks included); used by firmware/test/e2e_sdl.ts to check
# rendering at 720 (golden rule 6).
#   ~/venv/bin/esphome -s signalk_host 127.0.0.1 -s signalk_port 3000 compile firmware/esphelm_sdl_720.yaml
substitutions:
  screen_width: "720"
  screen_height: "720"
  font_value_size: "96"
  font_label_size: "42"
  font_small_size: "28"

packages:
  base: !include esphelm_sdl.yaml

esphome:
  name: esphelm-sdl-720

esphelm_runtime:
  board: sdl-720

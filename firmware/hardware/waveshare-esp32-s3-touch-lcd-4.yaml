# Waveshare ESP32-S3-Touch-LCD-4: 4" 480x480, ESP32-S3 with 8 MB octal PSRAM and 16 MB flash,
# ST7701S RGB panel (ESPHome's mipi_rgb model WAVESHARE-4-480X480), GT911 touch, and a TCA9554
# I/O expander that resets the panel (pin 2) and the touch controller (pin 0).
# Pins from ESPHome's model and Waveshare's wiki, matching the MIT-licensed config in
# github.com/ay129-35MR/Waveshare-ESP32-S3-Touch-LCD-4-Home-Assistant-Display.
# Not used: the buzzer on expander pin 5 (on/off only, so no rtttl tones), RS485, CAN and the SD slot.
substitutions:
  screen_width: "480"
  screen_height: "480"

esphome:
  min_version: 2026.1.1
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      # Code and constants in PSRAM keep the RGB panel fed while flash is written (preferences,
      # the cached layout), which would otherwise make the picture jump.
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      # mbedTLS's buffers in PSRAM, not internal RAM (ADR-0043).
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y

# The USB-C port is the S3's own USB (GPIO19/20): the default USB serial/JTAG logger.
logger:

json:

psram:
  mode: octal
  speed: 80MHz

preferences:
  flash_write_interval: 5min

i2c:
  - id: i2c_bus
    sda: GPIO15
    scl: GPIO7
    frequency: 400kHz

# TCA9554 (ESPHome's pca9554 driver): the panel's and touch controller's reset lines.
pca9554:
  - id: expander
    address: 0x20

# The panel's init commands go over this 3-wire SPI bus; the picture goes over the RGB bus.
spi:
  - id: lcd_spi
    clk_pin: GPIO2
    mosi_pin: GPIO1

display:
  - platform: mipi_rgb
    model: WAVESHARE-4-480X480
    spi_id: lcd_spi
    reset_pin:
      pca9554: expander
      number: 2
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: gt911
    id: touchscreen_
    i2c_id: i2c_bus
    interrupt_pin: GPIO16
    reset_pin:
      pca9554: expander
      number: 0
    # A touch while the screen is off wakes it (the runtime sees the light come on).
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: display_backlight

output:
  - platform: ledc
    id: backlight_
    pin: GPIO44
    # The backlight driver is on when its input is low.
    inverted: true
    frequency: 1220Hz

light:
  - platform: monochromatic
    name: "Backlight"
    output: backlight_
    id: display_backlight
    restore_mode: ALWAYS_ON
    on_turn_on:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
    on_turn_off:
      - lvgl.pause:

lvgl:
  id: lvgl_component
  buffer_size: 25%

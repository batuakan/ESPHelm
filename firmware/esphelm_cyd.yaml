# Runtime firmware for the ESP32-2432S028R "cheap yellow display" (2.8", 320x240, no PSRAM).
#   ~/venv/bin/esphome run firmware/esphelm_cyd.yaml
# Wi-Fi is set up through the captive portal (wifi.yaml), the SignalK server is found with mDNS.
# Smaller fonts for the small screen; no PSRAM, so no chart pages (ADR-0012).
substitutions:
  # ESPHomeSignalK git ref; release builds pin a commit with `-s signalk_ref <sha>` (ADR-0031).
  signalk_ref: main
  font_digits_huge_size: "96"
  font_digits_large_size: "64"
  font_huge_size: "48"
  font_value_size: "32"
  font_medium_size: "24"
  font_label_size: "16"
  font_small_size: "12"

packages:
  hardware: !include hardware/esp32-2432s028r.yaml
  wifi: !include wifi.yaml
  ota: !include ota.yaml
  fonts: !include fonts.yaml

esphome:
  name: esphelm-cyd
  name_add_mac_suffix: true
  friendly_name: "ESPHelm display"

external_components:
  # ESPHomeSignalK from GitHub (see CLAUDE.md §3).
  - source:
      type: git
      url: https://github.com/batuakan/ESPHomeSignalK
      ref: ${signalk_ref}
      path: components
    components: [signalk]
  - source:
      type: local
      path: components
    components: [esphelm_runtime, esphelm_tiles_color]

signalk:

lvgl:
  # The runtime switches the screen off itself (layout settings.screenTimeout, ADR-0015).
  pages:
    - id: esphelm_page
      widgets:
        - obj:
            id: esphelm_container
            width: 100%
            height: 100%

# The tiles this display renders (ADR-0035): the colour tile set.
esphelm_tiles_color:

esphelm_runtime:
  container: esphelm_container
  fonts:
    value: esphelm_font_value
    label: esphelm_font_label
    small: esphelm_font_small
    extra: [esphelm_font_medium, esphelm_font_huge]
    digits: [esphelm_font_digits_large, esphelm_font_digits_huge]
  board: esp32-2432s028r
  backlight: display_backlight
  touch: true

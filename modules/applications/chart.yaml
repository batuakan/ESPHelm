external_components:
  # equivalent shorthand for GitHub
  - source: github://batuakan/ESPTiles
    components: [ esptiles ]

esptiles:
  id: tiles
  url_template: "http://192.168.0.123:3000/rgb565/cmap/{z}/{x}/{y}?order=big_endian"


globals:

  - id: zoom
    type: int
    restore_value: yes
    initial_value: "15"

image:
  - file: modules/assets/self.png
    id: vessel_icon
    type: ${color_encoding}
    transparency: alpha_channel
    byte_order: ${byte_order}

  - file: modules/assets/anchor.png
    id: anchor_icon
    type: ${color_encoding}
    transparency: alpha_channel
    byte_order: ${byte_order}

sensor:
  - platform: signalk
    id: chart_navigation_headingTrue
    path: navigation.headingTrue
    period: 200
    accuracy_decimals: 2
    unit: "degrees"
    on_value:
      - lambda: |-
          int16_t angle = x * 10;
          lv_img_set_pivot(id(vessel_image), 9, 22);
          lv_img_set_angle(id(vessel_image), angle);

  - platform: signalk
    id: chart_navigation_anchor_maxRadius
    path: navigation.anchor.maxRadius
    period: 200
    accuracy_decimals: 2
    unit: "meters"
    on_value:
      - lambda: |-
          int p = id(tiles)->meters_to_pixels(x);
          // lv_obj_set_radius(id(anchor_border), p);
          lv_obj_set_width(id(anchor_border), 2*p);
          lv_obj_set_height(id(anchor_border), 2*p);
          lv_obj_set_style_radius(id(anchor_border), LV_RADIUS_CIRCLE, LV_PART_MAIN);
  

text_sensor:
  - platform: signalk
    id: navigation_position
    path: navigation.position
    on_value:
      then:
        - lambda: |-
            json::parse_json(x, [&](JsonObject root) -> bool {

              float latitude = root["latitude"].as<float>();
              float longitude = root["longitude"].as<float>();
              id(tiles)->set_chart_image(id(chart_image));
              id(tiles)->update_position(latitude, longitude, id(zoom));

              int z = id(zoom);
            

              id(tiles)->offset_object_to(id(vessel_image), latitude, longitude);
              

              char buf[64];
              snprintf(buf, sizeof(buf),
                      "Lat: %.6f Lon: %.6f Zm: %d",
                      latitude, longitude, z);
              lv_label_set_text(id(chart_position), buf);
              return true;
            });

  - platform: signalk
    id: navigation_anchor_position
    path: navigation.anchor.position
    on_value:
      then:
        - lambda: |-
            // ESP_LOGD("signalk", "Position: %s", x.c_str());

            json::parse_json(x, [&](JsonObject root) -> bool {

              float latitude = root["latitude"].as<float>();
              float longitude = root["longitude"].as<float>();

              id(tiles)->offset_object_to(id(anchor_border), latitude, longitude);
              id(tiles)->offset_object_to(id(anchor_image), latitude, longitude);
              
              return true;
            });


lvgl:
  pages:
    - id: chart_page

      <<: !include
        file: ../sections/swipe_navigation.yaml
      widgets:
        - container:
            width: 720
            height: 720
            clip_corner: true
            scrollable: false
            clickable: false
            widgets:
              - image:
                  id: chart_image
                  src: background_image
              - image:
                  id: vessel_image
                  src: vessel_icon
              - image:
                  id: anchor_image
                  src: anchor_icon
              - obj:
                  id: anchor_border 
                  width: 100
                  height: 100
                  # align: center
                  radius: 50 # Half of width/height
                  bg_color: green
                  bg_opa: 30%
                  border_color: red
                  border_width: 2
                  x: 721
                  y: 656

        - button:
            id: zoom_in_button
            x: 620
            y: 20
            width: 80
            height: 80
            widgets:
              - label:
                  text: "+"
                  text_font: roboto_scriptsize
            on_press:
              - lambda: |-
                  id(zoom) = std::min(19, id(zoom) + 1);
        - button:
            id: zoom_out_button
            x: 620
            y: 120
            width: 80
            height: 80        
            widgets:
              - label:
                  text: "-"
                  text_font: roboto_scriptsize
            on_press:
              - lambda: |-
                  id(zoom) = std::max(1, id(zoom) - 1);
        - obj:
            height: 10%
            width: 70%
            pad_left: 8
            pad_right: 8
            y: -10
            bg_opa: 80%
            align: BOTTOM_MID
            radius: 20
            widgets:
              - label:
                  id: chart_position
                  text: "---, ---"
                  text_font: roboto_tiny
                  align: CENTER

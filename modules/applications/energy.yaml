substitutions:
  energy_size: ${screen_width}
  energy_meter_width: ${energy_size / 15| int}
  energy_indicator_size: ${(energy_size / 8)| int}
  energy_icon_size: ${(energy_size / 8)| int}

# globals:
#   - id: swipe_started_at_top
#     type: bool
#     restore_value: no
#     initial_value: 'false'

sensor:
  - platform: signalk
    id: electrical_batteries_shunt_current
    path: electrical.batteries.shunt.current
    period: 2000
    accuracy_decimals: 2
    on_value:
      - lvgl.label.update:
          id: shunt_current_label
          text:
            format: "%.1f Ah"
            args: [ 'x' ]

  - platform: signalk
    id: electrical_solar_mppt_current
    path: electrical.solar.mppt.current
    period: 2000
    accuracy_decimals: 2
    on_value:
      - lvgl.label.update:
          id: solar_current_label
          text:
            format: "%.1f Ah"
            args: [ 'x' ]

  - platform: signalk
    id: electrical_batteries_shunt_voltage
    path: electrical.batteries.shunt.voltage
    period: 2000
    accuracy_decimals: 2
    on_value:
      - lvgl.indicator.update:
          id: battery_voltage_needle
          value: !lambda return x * 10;

  - platform: signalk
    id: electrical_batteries_shunt_capacity_stateOfCharge
    path: electrical.batteries.shunt.capacity.stateOfCharge
    period: 5000
    accuracy_decimals: 2
    unit: "percentage"
    on_value:
      - lvgl.indicator.update:
          id: battery_state_of_charge_needle
          value: !lambda return x;

  
  # - platform: homeassistant
  #   id: shorepower_current
  #   entity_id: sensor.tze284_cjbofhxw_ts0601_current
  #   accuracy_decimals: 2
  #   on_value:
  #     - lvgl.label.update:
  #         id: shorepower_current_label
  #         text:
  #           format: "%.1f Ah"
  #           args: [ 'x' ]

image:
  - file: modules/assets/houseBatteryVoltage.svg
    id: house_battery_voltage_indicator
    resize: 22x20
    type: ${color_encoding}
    transparency: alpha_channel
    byte_order: ${byte_order}

  - file: modules/assets/engineBatteryVoltage.svg
    id: engine_battery_voltage_indicator
    resize: 22x20
    type: ${color_encoding}
    transparency: alpha_channel
    byte_order: ${byte_order}

  - file: modules/assets/battery.svg
    id: battery_icon_60px
    resize: ${energy_icon_size}x${energy_icon_size}
    type: ${color_encoding}
    transparency: alpha_channel
    byte_order: ${byte_order}

  - file: modules/assets/solar.svg
    id: solar_icon_60px
    resize: ${energy_icon_size}x${energy_icon_size}
    type: ${color_encoding}
    transparency: alpha_channel
    byte_order: ${byte_order}

  - file: modules/assets/shore.svg
    id: shore_icon_60px
    resize: ${energy_icon_size}x${energy_icon_size}
    type: ${color_encoding}
    transparency: alpha_channel
    byte_order: ${byte_order}

lvgl:
  pages:
    - id: energy_page
      <<: !include
        file: ../base/swipe_navigation.yaml
      widgets:


        - image:
            src: background_image
            align: CENTER

        - meter:
            bg_opa: TRANSP
            align: CENTER
            height: 100%
            width: 100%
            border_width: 0
            # bg_color: 0x000000
            text_font: montserrat_24
            text_color: white
            scales:
              - range_from: 150 # scale for the needle value
                range_to: 100
                angle_range: 90
                rotation: 0
                indicators:
                  - image:
                      id: battery_voltage_needle
                      src: house_battery_voltage_indicator
                      pivot_x: -${size/2 - 60}
                      pivot_y: 10
                      value: 132
                  - image:
                      id: engine_battery_voltage_needle
                      src: engine_battery_voltage_indicator
                      pivot_x: -${size/2 -50}
                      pivot_y: 10
                      value: 128
                  - tick_style:
                      start_value: 15
                      end_value: 10
                      color_start: 0xFF00FF
                      color_end: 0xFF00FF
                      width: 2
              - range_from: 15 # scale for the needle value
                range_to: 10
                angle_range: 90
                rotation: 0
                ticks:
                  width: 1
                  count: 11
                  length: 10
                  major:
                      stride: 2
                      width: 3
                      length: 10
                      color: 0xFFFFFF
                      label_gap: 20
                      

              - range_from: 0 # scale for the value labels
                range_to: 100
                angle_range: 230
                rotation: 110
                ticks:
                  width: 3
                  count: 51
                  length: ${energy_meter_width}
                  # Un comment if you want labels for state of charge meter
                  major:
                      stride: 10
                      width: 3
                      length: ${energy_meter_width}
                      color: 0xFFFFFF
                      label_gap: 20
                indicators:
                  - image:
                      id: battery_state_of_charge_needle
                      src: house_battery_voltage_indicator
                      pivot_x: -${size/2 - 60}
                      pivot_y: 10
                      value: 55
                  - tick_style:
                      start_value: 0
                      end_value: 30
                      color_start: 0xFF0000
                      color_end: 0xFFFF00
                      width: 2
                      local: true
                  - tick_style:
                      start_value: 31
                      end_value: 40
                      color_start: 0xFFFF00
                      color_end: 0xFFFF00
                      width: 4
                      local: true
                  - tick_style:
                      start_value: 41
                      end_value: 100
                      color_start: 0xFFFF00
                      color_end: 0x00FF00
                      width: 8
                      local: true

        - obj:
            align: CENTER
            height: ${(energy_size * 0.50) | int}
            width: ${(energy_size * 0.60) | int}
            scrollable: false
            pad_top: 0
            pad_bottom: 0
            pad_left: 0
            pad_right: 0
            pad_all: 0
            bg_opa: TRANSP
            y: 10

            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: space_evenly
              flex_align_cross: stretch

            widgets: 
              - !include { file: ../components/icon_withvalue.yaml, vars: { id: speed_over_ground1, text: "00.0 Ah", image: shore_icon_60px, height: 33%} }
              - !include { file: ../components/icon_withvalue.yaml, vars: { id: shunt_current_label, text: "00.0 Ah", image: solar_icon_60px, height: 33%} }
              - !include { file: ../components/icon_withvalue.yaml, vars: { id: solar_current_label, text: "00.0 Ah", image: battery_icon_60px, height: 33%} }

        - !include { file: ../components/top_touch_detector.yaml }
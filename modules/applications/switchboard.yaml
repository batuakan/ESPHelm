substitutions:
  switch_height: 64
  switch_padding: 8

lvgl:
  pages:
    - id: switchboard_page
      <<: !include
        file: ../base/swipe_navigation.yaml
      widgets:
        - image:
            src: background_image
            align: CENTER

        - obj:
            id: switch_list
            width: 100%
            height: 100%
            scrollable: "true"
            scrollbar_mode: "OFF"
            pad_all: 8
            bg_opa: TRANSP

            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: STRETCH

            widgets: 
              - obj:
                  width: 100%
                  height: ${switch_height * 8 + switch_padding * 9 + 64}
                  scrollable: "false"
                  scrollbar_mode: "OFF"
                  pad_all: ${switch_padding}
                  bg_opa: 30%
                  radius: 20

                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: START
                    flex_align_cross: STRETCH
                  widgets:
                    - label:
                        text: "Navigation Lights"
                        text_font: roboto_normalsize
                        align: LEFT_MID
                        text_align: LEFT
                        pad_bottom: 8
                    - !include {vars: {name: "Navigation Lights", switch_id: navigation_lights}, file: ../components/digital_switch.yaml}
                    - !include {vars: {name: "Anchor Light", switch_id: anchor_light}, file: ../components/digital_switch.yaml}
                    - !include {vars: {name: "Bilge Pump", switch_id: bilge_pump}, file: ../components/digital_switch.yaml}
                    - !include {vars: {name: "Fresh Water Pump", switch_id: fresh_water_pump}, file: ../components/digital_switch.yaml}
                    - !include {vars: {name: "Water Heater", switch_id: water_heater}, file: ../components/digital_switch.yaml}
                    - !include {vars: {name: "Cabin Lights", switch_id: cabin_lights}, file: ../components/digital_switch.yaml}
                    - !include {vars: {name: "Galley Lights", switch_id: galley_lights}, file: ../components/digital_switch.yaml}
                    - !include {vars: {name: "Deck Lights", switch_id: deck_lights}, file: ../components/digital_switch.yaml}
              - obj:
                  width: 100%
                  height: ${switch_height * 5 + switch_padding * 6 + 64}
                  scrollable: "false"
                  scrollbar_mode: "OFF"
                  pad_all: ${switch_padding}
                  bg_opa: 30%
                  radius: 20

                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: START
                    flex_align_cross: STRETCH
                  widgets:
                    - label:
                        text: "Electronics"
                        text_font: roboto_normalsize
                        align: LEFT_MID
                        text_align: LEFT
                        pad_bottom: 8
                    - !include {vars: {name: "VHF Radio", switch_id: vhf_radio}, file: ../components/digital_switch.yaml}
                    - !include {vars: {name: "Chart Plotter", switch_id: chart_plotter}, file: ../components/digital_switch.yaml}
                    - !include {vars: {name: "Autopilot", switch_id: autopilot}, file: ../components/digital_switch.yaml}
                    - !include {vars: {name: "Radar", switch_id: radar}, file: ../components/digital_switch.yaml}
                    - !include {vars: {name: "AIS", switch_id: ais}, file: ../components/digital_switch.yaml}
              
              


        - !include { file: ../components/top_touch_detector.yaml }
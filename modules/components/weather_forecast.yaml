---
obj:
  bg_opa: TRANSP
  height: 100%
  width: 120
  scrollable: false                  
  scrollbar_mode: "OFF"
  layout:
    type: FLEX
    flex_flow: COLUMN
    flex_align_main: CENTER     # vertical centering
    flex_align_cross: CENTER    # horizontal centering
  
  widgets:
    - label:
        id: forecast_day_${id}
        text: "---"
        text_font: roboto_small
        text_align: CENTER
    - label:
        id: forecast_icon_${id}
        text: "--"
        text_font: roboto_normalsize
        text_align: CENTER
    - label:
        id: forecast_temp_high_${id}
        text: "--°"
        text_font: roboto_scriptsize
        text_align: CENTER
    - label:
        id: forecast_temp_low_${id}
        text: "--°"
        text_font: roboto_scriptsize
        text_align: CENTER
    - label:
        id: forecast_wind_bearing_${id}
        text: "\U000F005E"
        text_font: roboto_normalsize
        text_align: CENTER
        transform_angle: 0   # 90°
        transform_pivot_x: 50%
        transform_pivot_y: 50%
    - label:
        id: forecast_wind_speed_${id}
        text: "--"
        text_font: roboto_scriptsize
        text_align: CENTER
    - label:
        id: forecast_wind_gust_speed_${id}
        text: "--"
        text_font: roboto_scriptsize
        text_align: CENTER